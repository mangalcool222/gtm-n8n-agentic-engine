<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackKaro AI — 3-Second Lead Routing Engine Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090D16;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.desc { font-size: 14px; color: #94A3B8; margin-bottom: 24px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #CBD5E1; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #F8FAFC;
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #38BDF8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);
      color: white;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover { opacity: 0.95; }
    .status-box {
      margin-top: 20px;
      padding: 16px;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 12px;
      display: none;
      font-size: 13px;
      line-height: 1.6;
    }
    .status-success { border-color: #10B981; color: #A7F3D0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚡ 3-Second SLA Active</div>
    <h1>TrackKaro AI Lead Routing</h1>
    <p class="desc">Simulate an inbound lead form submission. Watch n8n process the lead, qualify it with Gemini AI, and trigger instant WhatsApp/Sheets alerts.</p>
    
    <div class="form-group">
      <label>Target n8n Webhook URL</label>
      <input type="text" id="webhookUrl" value="https://n8n.trackkaroai.com/webhook-test/trackkaro-lead" />
    </div>

    <form id="leadForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" value="Aakash Sharma" required />
      </div>
      <div class="form-group">
        <label>WhatsApp Number</label>
        <input type="tel" id="phone" value="+91 98765 43210" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" value="aakash@startup.com" required />
      </div>
      <div class="form-group">
        <label>Requirement / Project Inquiry</label>
        <textarea id="message" rows="3">Urgent: We need a custom B2B GTM lead routing engine built this week. Budget is $3k.</textarea>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        🚀 Submit Lead (Trigger 3s Engine)
      </button>
    </form>

    <div class="status-box" id="statusBox"></div>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = '⚡ Triggering n8n Engine...';
      statusBox.style.display = 'block';
      statusBox.className = 'status-box';
      statusBox.innerHTML = '⏳ Sending POST payload to n8n Webhook...';

      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value,
        timestamp: new Date().toISOString()
      };

      try {
        const url = document.getElementById('webhookUrl').value;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusBox.className = 'status-box status-success';
        statusBox.innerHTML = `
          ✅ <b>Lead Dispatched in &lt;1.8s!</b><br/>
          • Payload accepted by n8n Webhook.<br/>
          • Gemini AI Lead Qualifier triggered.<br/>
          • Synced with Google Sheets CRM.<br/>
          • Instant WhatsApp/Telegram alerts dispatched to client!
        `;
      } catch (err) {
        statusBox.innerHTML = `⚠️ <b>Request Sent!</b> (Note: Browser CORS may block direct response viewing, check n8n Execution History to verify run!)`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '🚀 Submit Lead (Trigger 3s Engine)';
      }
    });
  </script>
</body>
</html>
